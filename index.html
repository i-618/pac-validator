<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAC Validator</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        background: #0f172a;
        color: #e2e8f0;
      }
      .app {
        max-width: 1260px;
        margin: 0 auto;
        padding: 24px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
      .card {
        background: #111827;
        border: 1px solid #243041;
        border-radius: 12px;
        padding: 16px;
      }
      textarea,
      input,
      button {
        width: 100%;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0b1220;
        color: #e2e8f0;
        padding: 10px 12px;
        font: inherit;
      }
      textarea {
        min-height: 280px;
        resize: vertical;
      }
      button {
        cursor: pointer;
        background: #2563eb;
        border-color: #2563eb;
        font-weight: 600;
      }
      button.secondary {
        background: #1f2937;
        border-color: #334155;
      }
      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .row {
        display: grid;
        gap: 10px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .actions > * {
        flex: 1 1 160px;
      }
      .muted {
        color: #94a3b8;
        font-size: 0.92rem;
      }
      .loading-inline {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        border: 2px solid #334155;
        border-top-color: #60a5fa;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
        padding: 12px;
        background: #0b1220;
        border-radius: 8px;
        border: 1px solid #334155;
      }
      .error {
        color: #fca5a5;
      }
      h1,
      h2,
      h3 {
        margin-top: 0;
      }
      label {
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      .spaced {
        display: grid;
        gap: 12px;
      }
      code {
        background: #0b1220;
        padding: 0 4px;
        border-radius: 4px;
      }
      #graph {
        min-height: 320px;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px;
        background: #0b1220;
        overflow: auto;
      }
      .flow-root {
        display: grid;
        gap: 10px;
      }
      .flow-head {
        font-weight: 700;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #111827;
        padding: 8px 10px;
      }
      .flow-node {
        border: 1px solid #334155;
        border-radius: 8px;
        background: #111827;
        padding: 8px 10px;
        margin-top: 8px;
      }
      .flow-return {
        border-color: #16a34a;
      }
      .flow-kind {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #93c5fd;
      }
      .flow-text {
        margin-top: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.86rem;
      }
      .flow-branch {
        border-left: 2px solid #334155;
        margin-top: 8px;
        padding-left: 8px;
      }
      .flow-branch-label {
        font-size: 0.8rem;
        margin-bottom: 4px;
      }
      .flow-empty {
        font-size: 0.82rem;
        color: #64748b;
        margin-top: 6px;
      }
      .insight-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
      }
      .insight-cards > div {
        border: 1px solid #334155;
        background: #0b1220;
        border-radius: 10px;
        padding: 10px;
        display: grid;
        gap: 2px;
      }
      .insight-cards strong {
        font-size: 1.25rem;
      }
      .insight-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .insight-table th,
      .insight-table td {
        border-bottom: 1px solid #334155;
        padding: 8px;
        text-align: left;
        vertical-align: top;
      }
      .insight-table th {
        color: #93c5fd;
        font-weight: 600;
      }
      .trace {
        border: 1px solid #334155;
        background: #0b1220;
        border-radius: 10px;
        padding: 10px;
        min-height: 180px;
        max-height: 420px;
        overflow: auto;
      }
      .trace-line {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 0.88rem;
        line-height: 1.5;
      }
      .ok {
        color: #86efac;
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>
    <script type="module" src="./main.js?v=2"></script>
  </body>
</html>
